name: Generate Podcast

on:
  workflow_dispatch:
  # Uncomment the lines below if you want to run this on every push to main or on a cron schedule
  # push:
  #   branches: [ main ]
  # schedule:
  #   - cron: '0 0 * * 1' # Runs weekly on Monday at 00:00 UTC

jobs:
  generate:
    name: Run Podcast Generation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Create GCS Key File
        if: env.GCS_KEY_JSON != ''
        run: |
          echo "${{ secrets.GCS_KEY_JSON }}" > gcs-key.json
        env:
          GCS_KEY_JSON: ${{ secrets.GCS_KEY_JSON }}

      - name: Run Podcast Pipeline
        run: uv run main.py
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
